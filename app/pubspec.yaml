name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Payment (test mode only)
  razorpay_flutter: ^1.3.7

  # Location Services
  geolocator: ^14.0.2
  permission_handler: ^11.0.1

  # Used later for Nominatim Reverse Geocoding
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

  # Navigation
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App Launcher Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

# ⚠️ IMPORTANT: This MUST be outside `flutter:` block
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
